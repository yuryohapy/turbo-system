<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#7d1d2c"/><circle cx="256" cy="236" r="159" fill="none" stroke="#fff" stroke-width="22"/><path d="M256 236V106" stroke="#ffcf5a" stroke-width="22"/><path d="M256 236l85 50" stroke="#fff" stroke-width="22"/><circle cx="256" cy="236" r="20" fill="#fff"/><text x="256" y="478" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="70" fill="#fff">SUBS</text></svg>{
  "name": "LADY KITES 交代管理",
  "short_name": "交代管理",
  "description": "福岡大学女子バスケットボール部 LADY KITES の出場時間・交代管理",
  "lang": "ja",
  "start_url": "./",
  "scope": "./",
  "display": "standalone",
  "orientation": "any",
  "background_color": "#7d1d2c",
  "theme_color": "#7d1d2c",
  "icons": [
    { "src": "icon.svg", "sizes": "any", "type": "image/svg+xml", "purpose": "any" }
  ]
}// LADY KITES 交代管理: offline cache. Bump VERSION when files change.
const VERSION = 'lk-subs-2026-11-25b';
const CORE = ['./', './index.html', './manifest.webmanifest', './icon.svg'];
const CDN = ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];

self.addEventListener('install', e => {
  e.waitUntil((async () => {
    const c = await caches.open(VERSION);
    await c.addAll(CORE);
    await Promise.all(CDN.map(u => fetch(u, { mode: 'no-cors' }).then(r => c.put(u, r)).catch(() => {})));
    self.skipWaiting();
  })());
});

self.addEventListener('activate', e => {
  e.waitUntil((async () => {
    for (const k of await caches.keys()) if (k !== VERSION) await caches.delete(k);
    await self.clients.claim();
  })());
});

self.addEventListener('fetch', e => {
  const req = e.request;
  if (req.method !== 'GET') return;
  const url = new URL(req.url);
  const isPage = req.mode === 'navigate';
  if (isPage) {
    e.respondWith(fetch(req).then(r => { const cp = r.clone(); caches.open(VERSION).then(c => c.put('./index.html', cp)); return r; })
      .catch(() => caches.match('./index.html')));
    return;
  }
  if (url.origin === location.origin || /cdnjs\.cloudflare\.com|fonts\.(googleapis|gstatic)\.com/.test(url.host)) {
    e.respondWith(caches.match(req).then(hit => hit || fetch(req).then(r => { const cp = r.clone(); caches.open(VERSION).then(c => c.put(req, cp)); return r; })));
  }
});
