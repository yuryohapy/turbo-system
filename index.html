<style>
/* VOICE work: a bench tool read at a glance, under pressure, by a head coach
   IDEA the scorer's table: a scoreboard strip above the official player sheet
   PICTURE five on-court cards coloured by load, bench beneath, rotation chart at the side
   COLOUR FU maroon #7d1d2c band, white cards, amber caution, red over-limit
   TYPE Barlow Semi Condensed for every clock and minute, Noto Sans JP for names and labels
   LAYOUT iPad landscape: band / court row of 5 / bench grid + side panel; phone: stacked single column */
:root{color-scheme:light;--bg:#f3efef;--card:#ffffff;--ink:#1b1214;--mute:#6b5c5f;--line:#e3d9da;--maroon:#7d1d2c;--maroon2:#9c2a3c;--yel:#e8a900;--yelbg:#fff3c4;--red:#d7263d;--redbg:#ffe1e5;--ok:#2d6e5c;--sel:#1240e0;--track:rgba(107,92,95,.22);--track2:rgba(107,92,95,.12)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#110b0c;--card:#1d1416;--ink:#f3ecec;--mute:#b3a3a6;--line:#3a2c2f;--maroon2:#d0566a;--yelbg:#3b2f0c;--redbg:#4a1520;--ok:#5fbfa3;--sel:#7d9bff;--track:rgba(179,163,166,.22);--track2:rgba(179,163,166,.12)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#110b0c;--card:#1d1416;--ink:#f3ecec;--mute:#b3a3a6;--line:#3a2c2f;--maroon2:#d0566a;--yelbg:#3b2f0c;--redbg:#4a1520;--ok:#5fbfa3;--sel:#7d9bff;--track:rgba(179,163,166,.22);--track2:rgba(179,163,166,.12)}
button,.pc{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.kb{display:none}
@media(hover:hover) and (pointer:fine){.kb{display:inline}.pc:hover{border-color:var(--maroon2)}.pb button:hover,.tools button:hover{background:rgba(255,255,255,.2)}.btn:hover:not(:disabled){filter:brightness(1.08)}}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.d{font-family:"Barlow Semi Condensed","Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums}
.band{background:var(--maroon);color:#fff;padding:max(10px,env(safe-area-inset-top)) max(2vw,16px,env(safe-area-inset-right)) 10px max(2vw,16px,env(safe-area-inset-left));display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 20px;align-items:center}
.brand{font-weight:700;font-size:17px;line-height:1.2}
.brand small{display:block;font-weight:400;font-size:13px;opacity:.85}
.board{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:center}
.team{display:flex;align-items:center;gap:6px}
.team .lab{font-size:13px;opacity:.85;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-size:44px;font-weight:700;line-height:1;min-width:1.6em;text-align:center}
.pb{display:flex;gap:4px}
.pb button{min-width:40px;height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;font-weight:700;cursor:pointer}
.pb button:active{background:rgba(255,255,255,.3)}
.clock{display:flex;align-items:center;gap:8px;background:#1b0b0f;border-radius:12px;padding:4px 6px 4px 14px}
.per{font-size:22px;font-weight:600;color:#ffcf5a}
.time{font-size:52px;font-weight:700;line-height:1;background:none;border:0;color:#fff;cursor:pointer;padding:0 4px}
.go{width:56px;height:56px;border-radius:10px;border:0;font-weight:700;font-size:15px;cursor:pointer;background:#2fae6e;color:#fff}
.go.stop{background:var(--red)}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tools button{height:44px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;cursor:pointer;white-space:nowrap}
.tools button:disabled{opacity:.4}
.status{padding:6px max(2vw,16px);font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;border-bottom:1px solid var(--line)}
.status .lg{display:inline-flex;align-items:center;gap:5px}
.status .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.demo{background:var(--yelbg);color:var(--ink);padding:8px max(2vw,16px);font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo button{height:36px;border-radius:8px;border:1px solid var(--ink);background:transparent;padding:0 12px;cursor:pointer}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:14px max(2vw,16px) 96px}
h2{font-size:15px;margin:4px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 span{font-weight:400;color:var(--mute);font-size:13px}
.court{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.pc{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 11px;cursor:pointer;position:relative}
.pc.lv1{background:var(--yelbg);border-color:var(--yel)}
.pc.lv2{background:var(--redbg);border-color:var(--red)}
.pc.sel{outline:4px solid var(--sel);outline-offset:1px}
.pc:focus-visible{outline:3px solid var(--sel)}
.ph{display:flex;align-items:center;gap:6px}
.num{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:20px;background:var(--maroon);color:#fff;border-radius:6px;padding:0 6px;line-height:1.35}
.nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chip{font-size:13px;border-radius:999px;padding:1px 8px;white-space:nowrap;border:1px solid var(--line);background:var(--card)}
.chip.lv1{background:var(--yel);border-color:var(--yel);color:#1b1214}
.chip.lv2{background:var(--red);border-color:var(--red);color:#fff}
.big{font-size:38px;font-weight:700;line-height:1.05;margin:6px 0 4px;display:flex;align-items:baseline;gap:8px}
.big small{font-size:18px;font-weight:600}
.pm.pos{color:var(--ok)}
.pm.neg{color:var(--red)}
.mr{display:grid;grid-template-columns:2.6em minmax(0,1fr) auto;gap:6px;align-items:center;font-size:13px;margin-top:3px}
.mr .v{white-space:nowrap;font-family:"Barlow Semi Condensed",sans-serif;font-size:15px}
.bar{height:9px;border-radius:5px;background:var(--track);position:relative;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--maroon2)}
.bar i.lv1{background:var(--yel)}
.bar i.lv2{background:var(--red)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.na{font-size:13px;color:var(--mute)}
.bench .pc{padding:8px 10px}
.bench .big{font-size:26px;margin:4px 0 2px}
.bench .big small{font-size:15px}
.bench .rest{font-size:13px;color:var(--mute);white-space:nowrap}
.empty{border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--mute);min-height:150px;font-size:14px;text-align:center;padding:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.tl{display:grid;gap:3px}
.tlr{display:grid;grid-template-columns:5.2em minmax(0,1fr) 3.2em;gap:6px;align-items:center;font-size:13px}
.tlr .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlr .t{white-space:nowrap;text-align:right;font-family:"Barlow Semi Condensed",sans-serif;font-size:14px}
.trk{position:relative;height:14px;background:var(--track2);border-radius:3px}
.trk span{position:absolute;top:0;bottom:0;background:var(--maroon2);border-radius:2px}
.trk span.open{background:var(--maroon)}
.trk em{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.trk em.hf{background:var(--mute)}
.trk .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--sel)}
.qax{display:grid;grid-template-columns:5.2em minmax(0,1fr) 3.2em;gap:6px;font-size:12px;color:var(--mute)}
.qax div{display:flex;justify-content:space-around}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:500;color:var(--mute)}
td.r,th.r{text-align:right;white-space:nowrap;font-family:"Barlow Semi Condensed",sans-serif;font-size:15px}
.scroll{overflow-x:auto}
.pend{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--sel);padding:10px max(2vw,16px) max(10px,env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5;box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.pend .txt{flex:1;font-size:15px}
.btn{height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.btn.pri{background:var(--sel);color:#fff;border-color:var(--sel)}
.btn.mar{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.btn:disabled{opacity:.45;cursor:default}
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(720px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(20,8,10,.55)}
.dlg{padding:18px;overflow:auto;max-height:90vh}
.dlg h3{margin:0 0 12px;font-size:19px}
.dlg h4{margin:18px 0 8px;font-size:15px}
.fr{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:8px}
.fr label{display:grid;gap:3px;font-size:13px;color:var(--mute)}
input{font:16px "Noto Sans JP",sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
input[type=checkbox]{width:24px;height:24px;min-height:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--sel);outline-offset:1px}
.rt input{width:100%;min-width:3.5em}
.rt td{padding:3px}
.note{font-size:13px;color:var(--mute);margin:6px 0}
.dact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.msg{font-size:14px;margin-top:8px}
@media(max-width:1180px){main{grid-template-columns:minmax(0,1fr)}.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.side .panel{margin:0}}
@media(max-width:1000px){.band{grid-template-columns:minmax(0,1fr) auto}.board{grid-column:1/-1;order:3}}
@media(max-width:1000px){.court{gap:7px}.court .pc{padding:8px}.court .big{font-size:30px}.court .nm{font-size:14px}.court .chip{font-size:12px;padding:1px 6px}.court .mr{grid-template-columns:2.2em minmax(0,1fr);}.court .mr .v{grid-column:1/-1;text-align:right;margin-top:-2px}}
@media(max-width:760px){.court{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.side{grid-template-columns:minmax(0,1fr)}.court{grid-template-columns:repeat(2,minmax(0,1fr))}.time{font-size:42px}.sc{font-size:36px}.tools button{height:40px;padding:0 9px}}
@media(max-width:600px){table{font-size:13px}th,td{padding:5px 3px}.band{grid-template-columns:minmax(0,1fr)}.tools{justify-content:flex-start}}
@media(prefers-reduced-motion:no-preference){.pc{transition:background-color .4s,border-color .4s}}
</style>

<body>
<header class="band">
  <div class="brand">LADY KITES 交代管理<small id="oppLine">vs —</small></div>
  <div class="board">
    <div class="team"><span class="lab">福岡大</span><span class="sc d" id="scUs">0</span><div class="pb" data-side="us"><button data-v="1">+1</button><button data-v="2">+2</button><button data-v="3">+3</button></div></div>
    <div class="clock"><span class="per d" id="per">Q1</span><button class="time d" id="time" title="残り時間を修正">10:00</button><button class="go" id="go">開始</button></div>
    <div class="team"><span class="lab" id="oppLab">相手</span><span class="sc d" id="scTh">0</span><div class="pb" data-side="them"><button data-v="1">+1</button><button data-v="2">+2</button><button data-v="3">+3</button></div></div>
  </div>
  <div class="tools"><button id="undo">取り消し</button><button id="next">次のQへ</button><button id="exp">書き出し</button><button id="set">設定</button></div>
</header>
<div class="demo" id="demo" hidden>サンプル試合を表示しています（数値は架空）。<button id="demoNew">新しい試合を始める</button></div>
<div class="status"><span id="cloud">保存先を確認中</span><span class="lg"><i class="sw" style="background:var(--yel)"></i>目安−1分〜＋1分</span><span class="lg"><i class="sw" style="background:var(--red)"></i>目安＋1分超</span><span id="stintLg"></span><span class="kb">キー操作：Space 時計／Enter 交代確定／Esc 選択解除／Ctrl+Z 取り消し／1・2・3 福大得点／7・8・9 相手得点</span></div>
<main>
  <section>
    <h2>コート <span id="courtHint"></span></h2>
    <div class="court" id="court"></div>
    <h2>ベンチ <span>タップで交代候補に選択</span></h2>
    <div class="bench" id="bench"></div>
  </section>
  <aside class="side">
    <div class="panel"><h2>出場タイムライン <span id="tlNote"></span></h2><div id="tl"></div></div>
    <div class="panel"><h2>ラインナップ <span>出場時間順</span></h2><div class="scroll" id="lu"></div></div>
  </aside>
</main>
<div class="pend" id="pend" hidden><div class="txt" id="pendTxt"></div><button class="btn" id="pendX">選択解除</button><button class="btn pri" id="pendOk">交代確定</button></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script>
{
const Q=600,OT=300,HALF=1200,REG=2400,LS='lk-subs-v1';
const ROSTER0=[[88,'Kai',1950,1],[17,'Tsuki',1860,1],[9,'Toa',1680,1],[7,'Mai',1590,1],[30,'Rei',1410,1],[10,'Raki',1320,1],[20,'Noa',1230,1],[15,'Chie',810,1],[52,'Rino',600,1],[13,'Seru',1500,1],[18,'Rai',480,1],[11,'Saku',420,1],[21,'Sun',330,1],[12,'Neo',60,1],[2,'Koko',0,1],[31,'Kou',0,1],[5,'Yura',0,0],[6,'Yuu',0,0],[14,'Hima',0,0],[28,'Rin',0,0]];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtC=s=>{if(s<60&&s>0){return (Math.ceil(s*10)/10).toFixed(1)}return fmt(Math.ceil(s))};
const parseMS=t=>{t=String(t).trim();if(!t)return 0;const m=t.match(/^(\d+)(?::(\d{1,2}))?$/);if(!m)return null;return +m[1]*60+(m[2]?+m[2]:0)};
const PSTART=p=>p<=4?(p-1)*Q:REG+(p-5)*OT;
const PLEN=p=>p<=4?Q:OT;
const pName=p=>p<=4?'Q'+p:(p===5?'OT':'OT'+(p-4));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const newId=()=>'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function newGame(opp){return{id:newId(),opp:opp||'',date:today(),period:1,clock:Q,running:false,final:false,demo:false,events:[]}}
function baseState(){return{v:1,roster:ROSTER0.map(([no,name,avg,dr])=>({no,name,avg,dr:!!dr})),set:{sy:300,sr:420},g:newGame('')}}
function demoState(){
  const s=baseState();const g=s.g;g.demo=true;g.opp='鹿屋体育大学';
  const subs=[[0,[88,7,9,10,30],[]],[240,[20],[10]],[380,[17],[30]],[520,[52],[7]],[600,[10,7],[20,52]],[760,[30],[9]],[900,[18],[88]],[980,[88],[18]]];
  const us=[[30,2],[95,3],[150,2],[210,2],[300,2],[350,1],[420,3],[470,2],[560,2],[640,2],[700,3],[800,2],[850,2],[930,2],[1000,3]];
  const th=[[60,2],[120,2],[200,3],[260,2],[330,2],[400,2],[500,2],[580,3],[660,2],[720,2],[820,2],[880,1],[960,2],[1020,2]];
  const all=[...subs.map(x=>({gt:x[0],k:'sub',in:x[1],out:x[2]})),...us.map(x=>({gt:x[0],k:'pts',side:'us',v:x[1]})),...th.map(x=>({gt:x[0],k:'pts',side:'them',v:x[1]}))].sort((a,b)=>a.gt-b.gt||(a.k==='sub'?-1:1));
  const on=new Set();
  for(const e of all){const p=e.gt<REG?Math.floor(e.gt/Q)+1:5;e.p=p;e.cl=PSTART(p)+PLEN(p)-e.gt;if(e.k==='sub'){e.out.forEach(n=>on.delete(n));e.in.forEach(n=>on.add(n))}else e.on=[...on]}
  g.events=all;g.period=2;g.clock=165;return s;
}
let S;
try{const raw=localStorage.getItem(LS);S=raw?JSON.parse(raw):null}catch(e){S=null}
if(!S||!S.g||!Array.isArray(S.roster))S=demoState();
S.g.running=false;
{const OLD={88:1941,17:1865,9:1670,7:1581,30:1420,10:1333,20:1236,15:817,52:604,18:493,11:433,21:321,12:47},NEW={88:1950,17:1860,9:1680,7:1590,30:1410,10:1320,20:1230,15:810,52:600,18:480,11:420,21:330,12:60};S.roster.forEach(r=>{if(r.no===13&&r.avg===513)r.avg=1500;else if(OLD[r.no]===r.avg)r.avg=NEW[r.no]})}
let selOut=new Set(),selIn=new Set(),undoStack=[];
const gameTime=()=>PSTART(S.g.period)+PLEN(S.g.period)-S.g.clock;
const rosterMap=()=>{const m={};S.roster.forEach(r=>m[r.no]=r);return m};
const label=n=>{const r=rosterMap()[n];return '#'+n+(r?' '+r.name:'')};
const keyOf=a=>[...a].sort((x,y)=>x-y).join('-');
function ov(iv,a,b){let s=0;for(const[x,y]of iv)s+=Math.max(0,Math.min(y,b)-Math.max(x,a));return s}
function lvl(v,t){if(!(t>0))return 0;if(v>t+60)return 2;if(v>=t-60)return 1;return 0}

function derive(){
  const g=S.g,now=gameTime(),P={},on=new Set(),lu={},log=[];let us=0,th=0,segStart=0,segKey='';
  const pl=n=>P[n]||(P[n]={iv:[],pm:0,lastIn:null,lastOut:null});
  const L=k=>lu[k]||(lu[k]={sec:0,pf:0,pa:0});
  for(const e of g.events){
    if(e.k==='sub'){
      if(on.size)L(segKey).sec+=Math.max(0,e.gt-segStart);
      e.out.forEach(n=>{on.delete(n);const p=pl(n);if(p.lastIn!=null){p.iv.push([p.lastIn,e.gt]);p.lastIn=null}p.lastOut=e.gt});
      e.in.forEach(n=>{on.add(n);const p=pl(n);if(p.lastIn==null)p.lastIn=e.gt});
      segStart=e.gt;segKey=keyOf(on);log.push({e,us,th});
    }else if(e.k==='pts'){
      if(e.side==='us')us+=e.v;else th+=e.v;
      const l=L(keyOf(e.on));if(e.side==='us')l.pf+=e.v;else l.pa+=e.v;
      e.on.forEach(n=>{pl(n).pm+=e.side==='us'?e.v:-e.v});
    }
  }
  if(on.size)L(segKey).sec+=Math.max(0,now-segStart);
  const ps=PSTART(g.period),pe=ps+PLEN(g.period),M={};
  for(const r of S.roster){
    const p=pl(r.no),all=p.iv.concat(p.lastIn!=null?[[p.lastIn,now]]:[]),isOn=on.has(r.no);
    const reg=ov(all,0,REG),ot=ov(all,REG,1e9),cur=ov(all,ps,pe);
    let stint=null;if(isOn){let st=p.lastIn;if(now>=HALF&&st<HALF)st=HALF;stint=Math.max(0,now-st)}
    const rest=!isOn&&p.lastOut!=null?Math.max(0,now-p.lastOut):null;
    const qT=r.avg/4,cT=r.avg*Math.min(g.period,4)/4;
    const qL=g.period<=4?lvl(cur,qT):0,cL=lvl(reg,cT);
    const sL=stint==null?0:stint>=S.set.sr?2:stint>=S.set.sy?1:0;
    M[r.no]={r,on:isOn,all,reg,ot,tot:reg+ot,cur,qT,cT,qL,cL,sL,stint,rest,pm:p.pm,lv:isOn?Math.max(qL,cL,sL):cL};
  }
  return{now,on,M,lu,log,us,th};
}

function barRow(lab,v,t,l){
  if(!(t>0))return `<div class="mr"><span>${lab}</span><span class="na">目安なし</span><span class="v">${fmt(v)}</span></div>`;
  const mx=t+120,w=Math.min(100,v/mx*100),mk=t/mx*100;
  return `<div class="mr"><span>${lab}</span><div class="bar"><i class="lv${l}" style="width:${w}%"></i><b style="left:${mk}%"></b></div><span class="v">${fmt(v)}/${fmt(t)}</span></div>`;
}
function pmHtml(pm){const c=pm>0?'pos':pm<0?'neg':'';return `<small class="pm ${c}">${pm>0?'+':''}${pm}</small>`}
function courtCard(m){
  const r=m.r,g=S.g;
  const st=`<span class="chip lv${m.sL}">連続 ${fmt(m.stint)}</span>`;
  const q=g.period<=4?barRow(pName(g.period),m.cur,m.qT,m.qL):`<div class="mr"><span>${pName(g.period)}</span><span class="na">延長は警告対象外</span><span class="v">${fmt(m.cur)}</span></div>`;
  return `<button class="pc lv${m.lv}${selOut.has(r.no)?' sel':''}" data-no="${r.no}" data-z="c"><div class="ph"><span class="num">${r.no}</span><span class="nm">${esc(r.name)}</span>${st}</div><div class="big d">${fmt(m.tot)}${pmHtml(m.pm)}</div>${q}${barRow('累計',m.reg,m.cT,m.cL)}</button>`;
}
function benchCard(m){
  const r=m.r,rest=m.rest==null?(m.tot>0?'':'未出場'):'休 '+fmt(m.rest);
  return `<button class="pc lv${m.lv}${selIn.has(r.no)?' sel':''}" data-no="${r.no}" data-z="b"><div class="ph"><span class="num">${r.no}</span><span class="nm">${esc(r.name)}</span><span class="rest">${rest}</span></div><div class="big d">${fmt(m.tot)}${pmHtml(m.pm)}</div>${barRow('累計',m.reg,m.cT,m.cL)}</button>`;
}
function renderTL(D){
  const g=S.g,total=g.period>4?REG+(g.period-4)*OT:REG,rows=[];
  const lines=[];for(let p=2;p<=Math.max(4,g.period);p++){lines.push(`<em class="${p===3?'hf':''}" style="left:${PSTART(p)/total*100}%"></em>`)}
  for(const r of S.roster){const m=D.M[r.no];if(!m||(!m.all.length))continue;
    const seg=m.all.map(([a,b],i)=>`<span class="${m.on&&i===m.all.length-1?'open':''}" style="left:${a/total*100}%;width:${Math.max(.3,(b-a)/total*100)}%"></span>`).join('');
    rows.push(`<div class="tlr"><span class="n">#${r.no} ${esc(r.name)}</span><div class="trk">${lines.join('')}${seg}<i class="now" style="left:${Math.min(100,D.now/total*100)}%"></i></div><span class="t">${fmt(m.tot)}</span></div>`)}
  const qs=[];for(let p=1;p<=Math.max(4,g.period);p++)qs.push(`<span>${pName(p)}</span>`);
  $('tl').innerHTML=rows.length?`<div class="tl">${rows.join('')}<div class="qax"><span></span><div>${qs.join('')}</div><span></span></div></div>`:'<p class="note">交代を記録すると表示されます。</p>';
  $('tlNote').textContent='経過 '+fmt(D.now);
}
function renderLU(D){
  const rows=Object.entries(D.lu).filter(([k,v])=>k&&(v.sec>0||v.pf||v.pa)).sort((a,b)=>b[1].sec-a[1].sec).slice(0,8);
  if(!rows.length){$('lu').innerHTML='<p class="note">まだ記録がありません。</p>';return}
  const nm=n=>{const r=rosterMap()[n];return r?esc(r.name):'#'+n};
  $('lu').innerHTML=`<table><thead><tr><th>5人</th><th class="r">時間</th><th class="r">得</th><th class="r">失</th><th class="r">+/-</th></tr></thead><tbody>${rows.map(([k,v])=>{const d=v.pf-v.pa,cur=k===keyOf(D.on);return `<tr${cur?' style="font-weight:700"':''}><td>${k.split('-').map(nm).join('・')}${cur?'（出場中）':''}</td><td class="r">${fmt(v.sec)}</td><td class="r">${v.pf}</td><td class="r">${v.pa}</td><td class="r">${d>0?'+':''}${d}</td></tr>`}).join('')}</tbody></table>`;
}
function render(){
  const g=S.g,D=derive();
  $('scUs').textContent=D.us;$('scTh').textContent=D.th;
  $('per').textContent=g.final?'終了':pName(g.period);
  $('time').textContent=fmtC(g.clock);
  const go=$('go');go.textContent=g.running?'停止':'開始';go.classList.toggle('stop',g.running);go.disabled=g.final;
  $('oppLab').textContent=g.opp||'相手';$('oppLine').textContent='vs '+(g.opp||'—')+'　'+g.date;
  $('demo').hidden=!g.demo;$('undo').disabled=!undoStack.length;$('next').disabled=g.final;
  $('stintLg').textContent='連続出場：'+fmt(S.set.sy)+'で黄／'+fmt(S.set.sr)+'で赤（ハーフでリセット）';
  const onArr=S.roster.filter(r=>D.on.has(r.no));
  const extra=[...D.on].filter(n=>!rosterMap()[n]);
  let ch=onArr.map(r=>courtCard(D.M[r.no])).join('')+extra.map(n=>`<div class="empty">#${n}（名簿にない背番号）</div>`).join('');
  for(let i=D.on.size;i<5;i++)ch+=`<div class="empty">${i===0&&!g.events.length?'ベンチからスターター5人をタップ':'空き'}</div>`;
  $('court').innerHTML=ch;
  $('courtHint').textContent=D.on.size<5?(5-D.on.size)+'人空き：ベンチをタップで即入場':'タップで交代候補（OUT）';
  $('bench').innerHTML=S.roster.filter(r=>r.dr&&!D.on.has(r.no)).map(r=>benchCard(D.M[r.no])).join('')||'<p class="note">登録選手がいません（設定で登録）。</p>';
  renderTL(D);renderLU(D);
  const pend=selOut.size||selIn.size;$('pend').hidden=!pend;
  if(pend){$('pendTxt').innerHTML=`<b>OUT</b> ${[...selOut].map(n=>esc(label(n))).join('、')||'—'}　→　<b>IN</b> ${[...selIn].map(n=>esc(label(n))).join('、')||'—'}　<span class="na">（${pName(g.period)} 残り${fmtC(g.clock)}で記録）</span>`;$('pendOk').disabled=!(selOut.size===selIn.size&&selIn.size>0)}
}

function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let db=null,cloudMsg='保存先を確認中',cTimer=null,cBusy=false,cDirty=false;
const hhmm=()=>{const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
function renderStatus(){$('cloud').textContent=(S.g.demo?'サンプル表示中。':'この端末に保存済み。')+cloudMsg}
function scheduleCloud(){if(!db||S.g.demo)return;cDirty=true;clearTimeout(cTimer);cTimer=setTimeout(flushCloud,1500)}
async function flushCloud(){
  if(!db||cBusy||!cDirty)return;cBusy=true;cDirty=false;
  const D=derive(),g=S.g;
  const payload={opp:g.opp,date:g.date,period:g.period,clock:Math.round(g.clock),final:g.final,events:g.events,roster:S.roster,set:S.set,us:D.us,th:D.th,savedAt:new Date().toISOString()};
  try{await db.doc('games/'+g.id).set(payload);cloudMsg='クラウド保存 '+hhmm()}
  catch(e){cDirty=true;cloudMsg=e&&e.code==='quota_exceeded'?'クラウドの容量上限。古い試合の削除が必要です':'クラウド未保存（通信回復後に再保存）'}
  cBusy=false;renderStatus();
}
window.addEventListener('online',()=>{if(cDirty)flushCloud()});
(async()=>{let d=null;try{d=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){d=null}db=d;cloudMsg=db?'クラウド保存 待機中':'別端末へは設定のバックアップで移せます';renderStatus();if(db&&!S.g.demo&&S.g.events.length){cDirty=true;flushCloud()}})();
function commit(){saveLocal();scheduleCloud();render();renderStatus()}
function pushUndo(kind){undoStack.push({kind,ev:JSON.stringify(S.g.events),p:S.g.period,c:S.g.clock,f:S.g.final});if(undoStack.length>100)undoStack.shift()}
function addEvent(e){const g=S.g;e.gt=gameTime();e.p=g.period;e.cl=g.clock;g.events.push(e)}

$('court').addEventListener('click',ev=>{const b=ev.target.closest('.pc');if(!b||S.g.final)return;const n=+b.dataset.no;selOut.has(n)?selOut.delete(n):selOut.add(n);render()});
$('bench').addEventListener('click',ev=>{const b=ev.target.closest('.pc');if(!b||S.g.final)return;const n=+b.dataset.no,D=derive();
  if(D.on.size<5&&!selOut.size&&!selIn.size){pushUndo('sub');addEvent({k:'sub',in:[n],out:[]});commit();return}
  selIn.has(n)?selIn.delete(n):selIn.add(n);render()});
$('pendX').onclick=()=>{selOut.clear();selIn.clear();render()};
$('pendOk').onclick=()=>{if(!(selOut.size===selIn.size&&selIn.size))return;pushUndo('sub');addEvent({k:'sub',in:[...selIn],out:[...selOut]});selOut.clear();selIn.clear();commit()};
document.querySelectorAll('.pb').forEach(el=>el.addEventListener('click',ev=>{const b=ev.target.closest('button');if(b)score(el.dataset.side,+b.dataset.v)}));
function toggleClock(){const g=S.g;if(g.final)return;if(!g.running&&g.clock<=0)return;g.running=!g.running;last=performance.now();commit()}
$('go').onclick=toggleClock;
$('undo').onclick=()=>{const u=undoStack.pop();if(!u)return;S.g.events=JSON.parse(u.ev);if(u.kind==='period'||u.kind==='final'){S.g.period=u.p;S.g.clock=u.c;S.g.final=u.f;S.g.running=false}selOut.clear();selIn.clear();commit()};
let last=performance.now(),lastLocal=0;
setInterval(()=>{const t=performance.now(),d=(t-last)/1000;last=t;const g=S.g;if(!g.running)return;g.clock=Math.max(0,g.clock-d);if(g.clock<=0){g.clock=0;g.running=false;commit();return}if(t-lastLocal>2000){lastLocal=t;saveLocal()}render()},200);
function score(side,v){if(S.g.final)return;const D=derive();pushUndo('pts');addEvent({k:'pts',side,v,on:[...D.on]});commit()}
document.addEventListener('keydown',e=>{if($('dlg').open||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;
  if(e.code==='Space'){e.preventDefault();toggleClock();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('undo').click();return}
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  if(e.key==='Enter'&&!$('pend').hidden){e.preventDefault();$('pendOk').click();return}
  if(e.key==='Escape'&&(selOut.size||selIn.size)){selOut.clear();selIn.clear();render();return}
  const m={'1':['us',1],'2':['us',2],'3':['us',3],'7':['them',1],'8':['them',2],'9':['them',3]}[e.key];
  if(m){e.preventDefault();score(m[0],m[1])}});

const dlg=$('dlg');
function openDlg(html,bind){$('dlgBody').innerHTML=html;bind&&bind($('dlgBody'));if(!dlg.open)dlg.showModal()}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
function advance(to,kind){const g=S.g;pushUndo(kind);g.running=false;if(kind==='final'){g.final=true}else{g.period=to;g.clock=PLEN(to)}selOut.clear();selIn.clear();commit();dlg.close()}
$('time').onclick=()=>{const g=S.g;const s=Math.ceil(g.clock);
  openDlg(`<h3>残り時間の修正（${pName(g.period)}）</h3><p class="note">時計が遅れたときや、交代時に残り時間を入力する運用のときに使います。止めた状態で修正してから交代を確定してください。</p><div class="fr"><label>分<input id="cm" type="number" inputmode="numeric" min="0" max="10" value="${Math.floor(s/60)}"></label><label>秒<input id="cs" type="number" inputmode="numeric" min="0" max="59" value="${s%60}"></label></div><div class="dact"><button class="btn" id="cx">キャンセル</button><button class="btn pri" id="ok">反映</button></div>`,b=>{
  b.querySelector('#cx').onclick=()=>dlg.close();
  b.querySelector('#ok').onclick=()=>{const v=(+b.querySelector('#cm').value||0)*60+(+b.querySelector('#cs').value||0);g.clock=Math.min(PLEN(g.period),Math.max(0,v));g.running=false;commit();dlg.close()}})};
$('next').onclick=()=>{const g=S.g,warn=g.clock>0?`<p class="msg">まだ残り ${fmtC(g.clock)} あります。</p>`:'';
  if(g.period<4){openDlg(`<h3>${pName(g.period+1)}へ進む</h3>${warn}<p class="note">${g.period===2?'ハーフタイム：連続出場はQ3開始でリセットされます。':'Q間の休憩は連続出場に含めたまま続きます。'}コート上の5人はそのまま引き継ぎます。</p><div class="dact"><button class="btn" id="cx">キャンセル</button><button class="btn mar" id="ok">${pName(g.period+1)}へ</button></div>`,b=>{b.querySelector('#cx').onclick=()=>dlg.close();b.querySelector('#ok').onclick=()=>advance(g.period+1,'period')})}
  else{openDlg(`<h3>${pName(g.period)}終了</h3>${warn}<div class="dact"><button class="btn" id="cx">キャンセル</button><button class="btn" id="ot">延長（5分）へ</button><button class="btn mar" id="fin">試合終了</button></div>`,b=>{b.querySelector('#cx').onclick=()=>dlg.close();b.querySelector('#ot').onclick=()=>advance(g.period+1,'period');b.querySelector('#fin').onclick=()=>advance(g.period,'final')})}};

function sheets(){
  const D=derive(),g=S.g,dr=S.roster.filter(r=>r.dr||D.M[r.no].tot>0),maxP=Math.max(4,g.period);
  const min=[['#','NAME','MIN','MIN(分)','PM','目安','目安との差']];
  dr.forEach(r=>{const m=D.M[r.no];min.push([r.no,r.name,fmt(m.tot),+(m.tot/60).toFixed(2),m.pm,r.avg?fmt(r.avg):'',r.avg?+((m.reg-r.avg)/60).toFixed(2):''])});
  const qh=['#','NAME'];for(let p=1;p<=maxP;p++)qh.push(pName(p));qh.push('合計');const qs=[qh];
  dr.forEach(r=>{const m=D.M[r.no],row=[r.no,r.name];for(let p=1;p<=maxP;p++)row.push(fmt(ov(m.all,PSTART(p),PSTART(p)+PLEN(p))));row.push(fmt(m.tot));qs.push(row)});
  const nm=n=>{const r=rosterMap()[n];return r?r.name:'#'+n};
  const lu=[['5人','時間','時間(分)','得点','失点','+/-']];
  Object.entries(D.lu).filter(([k,v])=>k&&(v.sec||v.pf||v.pa)).sort((a,b)=>b[1].sec-a[1].sec).forEach(([k,v])=>lu.push([k.split('-').map(n=>'#'+n+' '+nm(+n)).join(' / '),fmt(v.sec),+(v.sec/60).toFixed(2),v.pf,v.pa,v.pf-v.pa]));
  const lg=[['Q','残り時間','IN','OUT','スコア（福大-相手）']];
  D.log.forEach(({e,us,th})=>lg.push([pName(e.p),fmt(Math.ceil(e.cl)),e.in.map(n=>'#'+n+' '+nm(n)).join('、'),e.out.map(n=>'#'+n+' '+nm(n)).join('、'),us+'-'+th]));
  return{MIN:min,'Q別':qs,'ラインナップ':lu,'交代ログ':lg};
}
const tsv=a=>a.map(r=>r.join('\t')).join('\n');
$('exp').onclick=()=>{const g=S.g;
  openDlg(`<h3>書き出し</h3><p class="note">シート：MIN（串刺し用の#・NAME・MIN・PM）／Q別／ラインナップ／交代ログ。</p><div class="dact" style="justify-content:flex-start"><button class="btn mar" id="x1">Excelファイルを保存</button><button class="btn" id="x2">MIN表をコピー（Excelに貼り付け）</button><button class="btn" id="cx">閉じる</button></div><p class="msg" id="xm"></p>`,b=>{
  const msg=t=>b.querySelector('#xm').textContent=t;
  b.querySelector('#cx').onclick=()=>dlg.close();
  b.querySelector('#x2').onclick=async()=>{try{await navigator.clipboard.writeText(tsv(sheets().MIN));msg('コピーしました。Excelのセルに貼り付けてください。')}catch(e){msg('この画面ではコピーできませんでした。Excelファイルの保存を使ってください。')}};
  b.querySelector('#x1').onclick=async()=>{
    let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
    if(!window.XLSX){msg('Excel作成ライブラリを読み込めませんでした（通信を確認）。MIN表のコピーを使ってください。');return}
    const wb=XLSX.utils.book_new(),sh=sheets();Object.entries(sh).forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n));
    const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const fn=`LADYKITES_交代_${g.date}_${(g.opp||'試合').replace(/[\\/:*?"<>|]/g,'')}.xlsx`;
    if(!dl){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);msg('保存しました：'+fn+'（ダウンロードフォルダ）')}catch(e){msg('この画面ではファイル保存が使えません。MIN表のコピーを使ってください。')}return}
    try{await dl.save({filename:fn,data:new Blob([buf])});msg('保存しました：'+fn)}catch(e){msg(e&&e.code==='declined'?'保存をキャンセルしました。':'保存できませんでした（'+(e&&e.code||'不明')+'）。')}}})};

function settingsHtml(){const g=S.g;
  return `<h3>設定</h3>
  <div class="fr"><label>対戦相手<input id="sOpp" value="${esc(g.opp)}" placeholder="例：鹿屋体育大学"></label><label>日付<input id="sDate" type="date" value="${esc(g.date)}"></label></div>
  <div class="fr"><label>連続出場 黄（分）<input id="sY" type="number" step="0.5" min="1" value="${S.set.sy/60}" style="width:7em"></label><label>連続出場 赤（分）<input id="sR" type="number" step="0.5" min="1" value="${S.set.sr/60}" style="width:7em"></label></div>
  <h4>選手名簿と目安（1試合平均）</h4>
  <p class="note">初期値＝BasketPlus公式、九産大・西南女学院大戦を除く6試合の出場試合平均を30秒単位に丸めた値。Seruは25:00に設定（2026-11-25指定）。Neoは1試合のみのため要確認。「登録」を外すとベンチに表示しません。</p>
  <div class="scroll"><table class="rt"><thead><tr><th>登録</th><th>#</th><th>名前</th><th>平均（分:秒）</th><th>1Q目安</th><th></th></tr></thead><tbody id="rtb">${S.roster.map((r,i)=>`<tr data-i="${i}"><td><input type="checkbox" data-f="dr" ${r.dr?'checked':''} aria-label="登録"></td><td><input data-f="no" inputmode="numeric" value="${r.no}" style="width:4.5em"></td><td><input data-f="name" value="${esc(r.name)}"></td><td><input data-f="avg" value="${r.avg?fmt(r.avg):''}" placeholder="なし" style="width:6em"></td><td class="r">${r.avg?fmt(r.avg/4):'—'}</td><td><button class="btn" data-del="${i}" style="height:40px;padding:0 10px">削除</button></td></tr>`).join('')}</tbody></table></div>
  <div class="dact" style="justify-content:flex-start"><button class="btn" id="sAdd">選手を追加</button></div>
  <p class="msg" id="sMsg"></p>
  <h4>試合</h4>
  <div class="dact" style="justify-content:flex-start"><button class="btn mar" id="sNew">新しい試合を始める</button>${db?'<button class="btn" id="sCloud">クラウドの試合を開く</button>':''}<button class="btn" id="sBak">記録をバックアップ保存</button><label class="btn" style="display:inline-grid;place-items:center;cursor:pointer">バックアップを読み込む<input type="file" id="sLoad" accept=".json,application/json" hidden></label><button class="btn" id="sDemo">サンプルを表示</button></div>
  <div id="sList"></div>
  <div class="dact"><button class="btn pri" id="sClose">閉じる</button></div>`}
function openSettings(){openDlg(settingsHtml(),b=>{
  const msg=t=>b.querySelector('#sMsg').textContent=t;
  b.querySelector('#sOpp').onchange=e=>{S.g.opp=e.target.value.trim();commit()};
  b.querySelector('#sDate').onchange=e=>{S.g.date=e.target.value||today();commit()};
  const th=(id,k)=>b.querySelector(id).onchange=e=>{const v=parseFloat(e.target.value);if(v>0){S.set[k]=Math.round(v*60);commit()}};th('#sY','sy');th('#sR','sr');
  b.querySelector('#rtb').addEventListener('change',e=>{const tr=e.target.closest('tr'),i=+tr.dataset.i,r=S.roster[i],f=e.target.dataset.f;
    if(f==='dr')r.dr=e.target.checked;
    else if(f==='name')r.name=e.target.value.trim()||r.name;
    else if(f==='no'){const v=parseInt(e.target.value,10);if(isNaN(v)||S.roster.some((x,j)=>j!==i&&x.no===v)){msg('背番号が空か重複しています。');e.target.value=r.no;return}r.no=v}
    else if(f==='avg'){const v=parseMS(e.target.value);if(v==null){msg('平均は「分:秒」で入力してください（例 25:30）。');e.target.value=r.avg?fmt(r.avg):'';return}r.avg=v;tr.cells[4].textContent=v?fmt(v/4):'—'}
    msg('');commit()});
  b.querySelector('#rtb').addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(!d)return;const i=+d.dataset.del,r=S.roster[i];
    if(derive().on.has(r.no)){msg('コート上の選手は削除できません。');return}S.roster.splice(i,1);commit();openSettings()});
  b.querySelector('#sAdd').onclick=()=>{let n=0;while(S.roster.some(r=>r.no===n))n++;S.roster.push({no:n,name:'新しい選手',avg:0,dr:true});commit();openSettings()};
  b.querySelector('#sNew').onclick=()=>confirmNew(b);
  b.querySelector('#sDemo').onclick=()=>{S=Object.assign(demoState(),{roster:S.roster,set:S.set});S.g.demo=true;undoStack=[];selOut.clear();selIn.clear();commit();dlg.close()};
  const cb=b.querySelector('#sCloud');if(cb)cb.onclick=()=>listCloud(b);
  b.querySelector('#sBak').onclick=()=>{const fn=`LADYKITES_交代記録_${S.g.date}_${(S.g.opp||'試合').replace(/[\\/:*?"<>|]/g,'')}.json`;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);msg('保存しました：'+fn+'（別の端末で「バックアップを読み込む」から開けます）')}catch(e){msg('保存できませんでした。')}};
  b.querySelector('#sLoad').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x||!x.g||!Array.isArray(x.roster)||!Array.isArray(x.g.events))throw 0;S=x;S.g.running=false;undoStack=[];selOut.clear();selIn.clear();commit();dlg.close()}catch(err){msg('このファイルは読み込めません（交代記録のバックアップを選んでください）。')}};
  b.querySelector('#sClose').onclick=()=>dlg.close()})}
function confirmNew(b){const box=b.querySelector('#sList');
  box.innerHTML=`<p class="msg">今の試合記録を閉じて新しい試合を始めます。${S.g.demo?'':'今の記録は端末内では上書きされます（クラウドに保存済みなら後から開けます）。'}名簿と目安は引き継ぎます。</p><div class="dact" style="justify-content:flex-start"><button class="btn mar" id="nOk">始める</button></div>`;
  box.querySelector('#nOk').onclick=()=>{startNew(S.g.demo?'':S.g.opp);dlg.close()}}
function startNew(opp){S.g=newGame('');undoStack=[];selOut.clear();selIn.clear();commit();openSettings()}
async function listCloud(b){const box=b.querySelector('#sList');
  if(!db){box.innerHTML='<p class="msg">この画面ではクラウドに接続できません。</p>';return}
  box.innerHTML='<p class="note">読み込み中…</p>';
  const t=setTimeout(()=>{box.innerHTML='<p class="msg">クラウドに接続できません（通信を確認）。</p>'},10000);
  try{const snap=await db.collection('games').orderBy('savedAt','desc').limit(30).get();clearTimeout(t);
    if(snap.empty){box.innerHTML='<p class="note">保存された試合はまだありません。</p>';return}
    box.innerHTML=`<div class="scroll"><table><thead><tr><th>日付</th><th>相手</th><th class="r">スコア</th><th>状態</th><th></th></tr></thead><tbody>${snap.docs.map(d=>{const x=d.data()||{};return `<tr><td>${esc(x.date)}</td><td>${esc(x.opp||'—')}</td><td class="r">${esc(x.us)}-${esc(x.th)}</td><td>${x.final?'終了':esc(pName(+x.period||1))}</td><td><button class="btn" data-id="${esc(d.id)}" style="height:40px">開く</button></td></tr>`}).join('')}</tbody></table></div>`;
    box.querySelectorAll('[data-id]').forEach(bt=>bt.onclick=()=>{const d=snap.docs.find(x=>x.id===bt.dataset.id),x=d.data();
      S.g={id:d.id,opp:String(x.opp||''),date:String(x.date||today()),period:+x.period||1,clock:+x.clock||0,running:false,final:!!x.final,demo:false,events:Array.isArray(x.events)?JSON.parse(JSON.stringify(x.events)):[]};
      if(Array.isArray(x.roster)&&x.roster.length)S.roster=JSON.parse(JSON.stringify(x.roster));if(x.set)S.set=Object.assign({},x.set);
      undoStack=[];selOut.clear();selIn.clear();saveLocal();render();renderStatus();dlg.close()})}
  catch(e){clearTimeout(t);box.innerHTML='<p class="msg">読み込めませんでした（'+esc(e&&e.code||'不明')+'）。</p>'}}
$('set').onclick=openSettings;
$('demoNew').onclick=()=>{S.g=newGame('');undoStack=[];selOut.clear();selIn.clear();commit();openSettings()};
document.addEventListener('mouseup',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&!b.closest('dialog'))b.blur()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude\.ai|claudeusercontent/.test(location.host)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
render();renderStatus();
}
</script>
