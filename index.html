<title>Rotation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE work: a bench tool read at a glance, under pressure, by a head coach
   IDEA the scorer's table: a scoreboard strip above the official player sheet
   PICTURE five on-court cards coloured by load, bench beneath, rotation chart at the side
   COLOUR FU maroon #7d1d2c band, white cards, amber caution, red over-limit
   TYPE Barlow Semi Condensed for every clock and minute, Noto Sans JP for names and labels
   LAYOUT iPad landscape: band / court row of 5 / bench grid + side panel; phone: stacked single column */
:root{color-scheme:light;--bg:#f3efef;--card:#ffffff;--ink:#1b1214;--mute:#6b5c5f;--line:#e3d9da;--maroon:#7d1d2c;--maroon2:#9c2a3c;--yel:#e8a900;--yelbg:#fff3c4;--red:#d7263d;--redbg:#ffe1e5;--ok:#2d6e5c;--sel:#1240e0;--track:rgba(107,92,95,.22);--track2:rgba(107,92,95,.12)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#110b0c;--card:#1d1416;--ink:#f3ecec;--mute:#b3a3a6;--line:#3a2c2f;--maroon2:#d0566a;--yelbg:#3b2f0c;--redbg:#4a1520;--ok:#5fbfa3;--sel:#7d9bff;--track:rgba(179,163,166,.22);--track2:rgba(179,163,166,.12)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#110b0c;--card:#1d1416;--ink:#f3ecec;--mute:#b3a3a6;--line:#3a2c2f;--maroon2:#d0566a;--yelbg:#3b2f0c;--redbg:#4a1520;--ok:#5fbfa3;--sel:#7d9bff;--track:rgba(179,163,166,.22);--track2:rgba(179,163,166,.12)}
button,.pc{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.kb{display:none}
@media(hover:hover) and (pointer:fine){.kb{display:inline}.pc:hover{border-color:var(--maroon2)}.pb button:hover,.tools button:hover{background:rgba(255,255,255,.2)}.btn:hover:not(:disabled){filter:brightness(1.08)}}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.d{font-family:"Barlow Semi Condensed","Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums}
.band{background:var(--maroon);color:#fff;padding:max(10px,env(safe-area-inset-top)) max(2vw,16px,env(safe-area-inset-right)) 10px max(2vw,16px,env(safe-area-inset-left));display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 20px;align-items:center}
.brand{font-weight:700;font-size:17px;line-height:1.2}
.brand small{display:block;font-weight:400;font-size:13px;opacity:.85}
.board{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:center}
.team{display:flex;align-items:center;gap:6px}
.team .lab{font-size:13px;opacity:.85;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-size:44px;font-weight:700;line-height:1;min-width:1.6em;text-align:center}
.pb{display:flex;gap:4px}
.pb button{min-width:40px;height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;font-weight:700;cursor:pointer}
.pb button:active{background:rgba(255,255,255,.3)}
.clock{display:flex;align-items:center;gap:8px;background:#1b0b0f;border-radius:12px;padding:4px 6px 4px 14px}
.per{font-size:22px;font-weight:600;color:#ffcf5a}
.time{font-size:52px;font-weight:700;line-height:1;background:none;border:0;color:#fff;cursor:pointer;padding:0 4px}
.go{width:56px;height:56px;border-radius:10px;border:0;font-weight:700;font-size:15px;cursor:pointer;background:#2fae6e;color:#fff}
.go.stop{background:var(--red)}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tools button{height:44px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;cursor:pointer;white-space:nowrap}
.tools button:disabled{opacity:.4}
.status{padding:6px max(2vw,16px);font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;border-bottom:1px solid var(--line)}
.status .lg{display:inline-flex;align-items:center;gap:5px}
.status .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.demo{background:var(--yelbg);color:var(--ink);padding:8px max(2vw,16px);font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo button{height:36px;border-radius:8px;border:1px solid var(--ink);background:transparent;padding:0 12px;cursor:pointer}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:14px max(2vw,16px) 96px}
h2{font-size:15px;margin:4px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 span{font-weight:400;color:var(--mute);font-size:13px}
.court{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}

<script>
{

const DEFSET=()=>({sy:300,sr:420,lowcap:600,lowq:240});

{const OLD={88:1941,17:1865,9:1670,7:1581,30:1420,10:1333,20:1236,15:817,52:604,18:493,11:433,21:321,12:47},NEW={88:1950,17:1860,9:1680,7:1590,30:1410,10:1320,20:1230,15:810,52:600,18:480,11:420,21:330,12:60};S.roster.forEach(r=>{if(r.no===13&&r.avg===513)r.avg=1500;else if(OLD[r.no]===r.avg)r.avg=NEW[r.no]})}

function maxStints(m){let best=0;for(const[a,b]of m.all){if(a<HALF&&b>HALF){best=Math.max(best,HALF-a,b-HALF)}else best=Math.max(best,b-a)}return best}
function report(){
  const g=S.g,D=derive(),t=curTeam(),nm=n=>{const r=rosterMap()[n];return '#'+n+' '+(r?r.name:'')};
  const L=[];L.push('【試合後レポート】'+(t.short||t.name)+' '+D.us+'-'+D.th+' '+(g.opp||'相手'));
  L.push(g.date+(g.tourn?'　'+g.tourn:'')+(g.final?'':'　（'+pName(g.period)+' 残り'+fmtC(g.clock)+'時点）'));
  const qs=[];for(let p=1;p<=Math.max(4,g.period);p++){let u=0,o=0;g.events.forEach(e=>{if(e.k==='pts'&&e.p===p){if(e.side==='us')u+=e.v;else o+=e.v}});if(p<=g.period)qs.push(pName(p)+' '+u+'-'+o)}
  L.push('Q別：'+qs.join(' / '));
  const pl=S.roster.map(r=>D.M[r.no]).filter(m=>m&&m.tot>0);
  const ea=m=>effAvg(m.r)*Math.min(g.period,4)/4;
  L.push('');L.push('■出場時間（目安との差）');
  pl.slice().sort((a,b)=>(b.reg-ea(b))-(a.reg-ea(a))).forEach(m=>{const d=m.reg-ea(m),mark=d>60?'▲':d<-180?'▽':'　';L.push(mark+nm(m.r.no)+' '+fmt(m.tot)+'（目安'+fmt(ea(m))+' '+(d>=0?'+':'−')+fmt(Math.abs(d))+'）'+(m.pm?' '+(m.pm>0?'+':'')+m.pm:''))});
  L.push('▲＝目安より1分超多い　▽＝3分以上少ない');
  const st=pl.map(m=>({m,s:maxStints(m)})).sort((a,b)=>b.s-a.s).slice(0,3).filter(x=>x.s>0);
  if(st.length){L.push('');L.push('■長かった連続出場');st.forEach(x=>L.push('・'+nm(x.m.r.no)+' '+fmt(x.s)+(x.s>=S.set.sr?'（基準超え）':x.s>=S.set.sy?'（注意）':'')))}
  const lus=Object.entries(D.lu).filter(([k,v])=>k&&k.split('-').length===5&&v.sec>=180).map(([k,v])=>({k,v,r:luRate(v)})).sort((a,b)=>b.r-a.r);
  if(lus.length){const show=x=>'・'+x.k.split('-').map(n=>{const r=rosterMap()[n];return r?r.name:'#'+n}).join('・')+' '+fmt(x.v.sec)+' '+(x.v.pf-x.v.pa>0?'+':'')+(x.v.pf-x.v.pa)+'（1分あたり'+fmtRate(x.r)+'）';
    L.push('');L.push('■ラインナップ（3分以上）');L.push('良かった');lus.slice(0,2).forEach(x=>L.push(show(x)));if(lus.length>2){L.push('課題');lus.slice(-2).reverse().forEach(x=>L.push(show(x)))}}
  return L.join('\n')}
function sheets(){
  const D=derive(),g=S.g,dr=S.roster.filter(r=>r.dr||D.M[r.no].tot>0),maxP=Math.max(4,g.period);
  const min=[['#','NAME','MIN','MIN(分)','PM','目安','目安との差']];
  dr.forEach(r=>{const m=D.M[r.no];min.push([r.no,r.name,fmt(m.tot),+(m.tot/60).toFixed(2),m.pm,fmt(effAvg(r))+(isFixed(r)?'（固定）':''),+((m.reg-effAvg(r))/60).toFixed(2)])});
  const qh=['#','NAME'];for(let p=1;p<=maxP;p++)qh.push(pName(p));qh.push('合計');const qs=[qh];
  dr.forEach(r=>{const m=D.M[r.no],row=[r.no,r.name];for(let p=1;p<=maxP;p++)row.push(fmt(ov(m.all,PSTART(p),PSTART(p)+PLEN(p))));row.push(fmt(m.tot));qs.push(row)});
  const nm=n=>{const r=rosterMap()[n];return r?r.name:'#'+n};
  const lu=[['5人','時間','時間(分)','得点','失点','+/-','+/-（1分あたり）']];
  Object.entries(D.lu).filter(([k,v])=>k&&(v.sec||v.pf||v.pa)).sort(luSort).forEach(([k,v])=>{const r=luRate(v);lu.push([k.split('-').map(n=>'#'+n+' '+nm(+n)).join(' / '),fmt(v.sec),+(v.sec/60).toFixed(2),v.pf,v.pa,v.pf-v.pa,r===null?'':+r.toFixed(2)])});
  const lg=[['Q','残り時間','IN','OUT','スコア（'+(curTeam().short||curTeam().name)+'-相手）']];
  D.log.forEach(({e,us,th})=>lg.push([pName(e.p),fmt(Math.ceil(e.cl)),e.in.map(n=>'#'+n+' '+nm(n)).join('、'),e.out.map(n=>'#'+n+' '+nm(n)).join('、'),us+'-'+th]));
  return{MIN:min,'Q別':qs,'ラインナップ':lu,'交代ログ':lg};
}

function ensureTeam(x){const tid=teamOf(x);if(!S.teams.some(t=>t.id===tid))S.teams.push({id:tid,name:String(x.teamName||'チーム'),short:String(x.teamShort||x.teamName||'自チーム'),roster:JSON.parse(JSON.stringify(Array.isArray(x.roster)?x.roster:[])),set:Object.assign(DEFSET(),x.set||{})});return tid}
function openGameRec(x){if(x.id!==S.g.id)archiveCurrent();
  const tid=ensureTeam(x);if(tid!==S.tid)switchTeam(tid);
  S.g={id:x.id,opp:String(x.opp||''),date:String(x.date||today()),tourn:String(x.tourn||''),team:tid,period:+x.period||1,clock:+x.clock||0,running:false,final:!!x.final,demo:false,events:Array.isArray(x.events)?x.events:[]};
  const have=new Set(S.roster.map(r=>r.no));S.g.events.forEach(e=>(e.in||[]).forEach(n=>{if(!have.has(n)){const s=(Array.isArray(x.roster)?x.roster:[]).find(r=>r.no===n);S.roster.push({no:n,name:s?s.name:'#'+n,avg:s?s.avg:0,dr:false});have.add(n)}}));
  undoStack=[];selOut.clear();selIn.clear();commit()}

function tGames(t){return loadHist().filter(x=>mine(x)&&String(x.tourn||'')===t).length+(!S.g.demo&&S.g.tourn===t&&!loadHist().some(x=>x.id===S.g.id)?1:0)}
function renameTourn(a,b){const H=loadHist();let ch=false;H.forEach(x=>{if(mine(x)&&String(x.tourn||'')===a){x.tourn=b;x.savedAt=new Date().toISOString();ch=true;markDirty(x.id)}});if(ch)saveHist(H);

  const L=loadTL().filter(x=>x.name!==a&&x.name!==b);if(b)L.unshift({name:b,added:today()});saveTL(L);if(homeT===a)homeT=b||'';{const o=loadSel();if(o.full){o.full=o.full.map(x=>x===a?(b||''):x);saveSel(o)}}}
function tournaments(){const m={};const add=(t,d)=>{t=String(t||'').trim();if(!t)return;if(!m[t]||String(d)>m[t])m[t]=String(d||'')};loadTL().forEach(x=>add(x.name,x.added));loadHist().filter(mine).forEach(x=>add(x.tourn,x.date));if(!S.g.demo&&mine(S.g))add(S.g.tourn,S.g.date);return Object.keys(m).sort((a,b)=>m[b].localeCompare(m[a])||a.localeCompare(b))}

const LSEL='lk-subs-sel-v1';
function selGames(){return loadHist().filter(x=>mine(x)&&Array.isArray(x.min)&&!x.demo)}
function loadSelAll(){try{const o=JSON.parse(localStorage.getItem(LSEL)||'{}');return o&&typeof o==='object'?o:{}}catch(e){return{}}}

function saveSel(o){const a=loadSelAll();a[S.tid]=o;try{localStorage.setItem(LSEL,JSON.stringify(a))}catch(e){}}
function selectedIds(){const o=loadSel(),G=selGames(),ids=new Set(o.ids),full=new Set(o.full||[]);return new Set(G.filter(x=>o.all||ids.has(x.id)||full.has(String(x.tourn||''))).map(x=>x.id))}
function storeSel(set){const G=selGames(),by={};G.forEach(x=>{const t=String(x.tourn||'');(by[t]=by[t]||[]).push(x)});
  const full=Object.keys(by).filter(t=>by[t].every(x=>set.has(x.id)));const all=G.length>0&&G.every(x=>set.has(x.id));saveSel({all,ids:[...set].filter(id=>G.some(x=>x.id===id)),full})}
function season(){const sel=selectedIds();const H=selGames().filter(x=>sel.has(x.id));const A={};let from='',to='';
  for(const x of H){const d=String(x.date||'');if(d&&(!from||d<from))from=d;if(d>to)to=d;for(const m of x.min){const a=A[m.no]||(A[m.no]={no:m.no,name:m.name,gp:0,sec:0,pm:0});a.gp++;a.sec+=Math.round((+m.dec||0)*60);a.pm+=(+m.pm||0);a.name=m.name}}
  return{n:H.length,from,to,rows:Object.values(A).sort((p,q)=>q.sec/q.gp-p.sec/p.gp)}}
function recentGames(){return loadHist().filter(x=>!x.demo&&mine(x)).sort((x,y)=>String(y.date||'').localeCompare(String(x.date||''))||String(y.savedAt||'').localeCompare(String(x.savedAt||''))).slice(0,6)}

  const ss=season(),G=selGames(),selSet=selectedIds();

  const selSum=G.length?Object.keys(byT).filter(t=>byT[t][0]).map(t=>esc(t||'大会なし')+' '+byT[t][0]+'/'+byT[t][1]).join('、'):'';
  const sel=`<button class="btn" data-h="pick">試合を選ぶ（${selSet.size}/${G.length}）</button>`;
  const seasonHtml=`<div class="hcard hwide"><div style="display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px"><h3 style="margin:0">累計出場時間</h3>${sel}<span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">${ss.n?'<button class="btn" data-h="apply">平均を目安に反映</button>':''}<button class="btn" data-h="tman">大会の管理</button></span></div>${ss.n?`<p class="note">選択中：${selSum}。${ss.n}試合（${esc(ss.from)}〜${esc(ss.to)}）の集計。平均は出場した試合だけで割っています。進行中の試合は含みません。</p><div class="scroll"><table><thead><tr><th>#</th><th>選手</th><th class="r">試合</th><th class="r">合計</th><th class="r">平均</th><th class="r">今の目安</th><th class="r">+/-</th></tr></thead><tbody>${ss.rows.map(a=>{const r=rosterMap()[a.no],ea=r?effAvg(r):null,avg=a.sec/a.gp;return `<tr><td>${esc(a.no)}</td><td>${esc(a.name)}</td><td class="r">${a.gp}</td><td class="r">${fmt(a.sec)}</td><td class="r"><b>${fmt(avg)}</b></td><td class="r">${ea==null?'—':fmt(ea)+(isFixed(r)?'（固定）':'')}</td><td class="r">${a.pm>0?'+':''}${a.pm}</td></tr>`}).join('')}</tbody></table></div>`:(G.length?'<p class="note">試合が選ばれていません。「試合を選ぶ」から選んでください。</p>':'<p class="note">保存された試合はまだありません。試合を保存すると、選手ごとの合計・平均出場時間が出ます。</p>')}</div>`;

  b.innerHTML=`${warn}<div>${resume}<div class="hcard"${resume?' style="margin-top:16px"':''}><h3>新しい試合</h3><p class="note">相手・日付・登録選手・スターターを決めてから試合画面に進みます。${canResume()?'途中の試合は「試合一覧」に保存されます。':''}</p><button class="btn ${resume?'':'mar '}hbtn" data-h="new">新しい試合の準備</button></div></div>${recent}${seasonHtml}`;
}

$('home').addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.hopen){const x=loadHist().find(r=>r.id===t.dataset.hopen);if(x){openGameRec(x);hideHome()}return}
  if(t.dataset.tn!==undefined){draft.tourn=t.dataset.tn;renderHome();return}
  if(t.dataset.dr){const n=+t.dataset.dr;if(draft.dr.has(n)){draft.dr.delete(n);draft.st=draft.st.filter(x=>x!==n)}else draft.dr.add(n);renderHome();return}
  if(t.dataset.st){const n=+t.dataset.st;if(draft.st.includes(n))draft.st=draft.st.filter(x=>x!==n);else if(draft.st.length<5)draft.st.push(n);else{$('nMsg').textContent='スターターは5人までです。外してから選んでください。';return}renderHome();return}
  const a=t.dataset.h;
  if(a==='resume'){hideHome()}
  else if(a==='new'){const TL0=tournaments();draft={tourn:(S.g.tourn&&!S.g.demo)?S.g.tourn:(TL0[0]||''),opp:'',date:today(),dr:new Set(S.roster.filter(r=>r.dr).map(r=>r.no)),st:[]};homeView='setup';renderHome();$('home').scrollTop=0}
  else if(a==='back'){homeView='main';renderHome()}
  else if(a==='start'){const d=draft;if(d.st.length&&d.st.length!==5){$('nMsg').textContent='スターターは5人ちょうど選ぶか、全員外してください（あとで試合画面で選べます）。';return}
    archiveCurrent();S.roster.forEach(r=>r.dr=d.dr.has(r.no));S.g=newGame(d.opp.trim());S.g.date=d.date||today();S.g.tourn=(d.tourn||'').trim();undoStack=[];selOut.clear();selIn.clear();
    if(d.st.length===5){S.g.events.push({k:'sub',in:d.st.slice(),out:[],gt:0,p:1,cl:Q})}
    commit();homeView='main';hideHome()}
  else if(a==='all'){hideHome();openHist()}
  else if(a==='tman'){openTMan()}
  else if(a==='apply'){openApply()}
  else if(a==='pick'){openPick()}
  else if(a==='bset'){openSettings();setTimeout(()=>{const el=$('gUrl');if(el)el.scrollIntoView({block:'center'})},50)}
});
const r30=s=>Math.floor((s+15)/30)*30;

  <p class="msg" id="apMsg"></p><div class="dact"><button class="btn" id="apX">やめる</button><button class="btn mar" id="apOk">チェックした選手に反映</button></div>`,b=>{

function openPick(){
  const G=selGames(),cur=selectedIds(),TL=tournaments();
  const keys=[...TL.filter(t=>G.some(x=>String(x.tourn||'')===t)),...(G.some(x=>!x.tourn)?['']:[])];
  const grp=keys.map((t,gi)=>{const L=G.filter(x=>String(x.tourn||'')===t).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    return `<div style="margin-top:12px;border:1px solid var(--line);border-radius:10px"><label style="display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--bg);border-radius:10px 10px 0 0;font-weight:700;cursor:pointer"><input type="checkbox" data-pg="${gi}">${esc(t||'大会なし（練習試合など）')}<span class="na" style="margin-left:auto" data-pc="${gi}"></span></label>${L.map(x=>`<label style="display:flex;gap:10px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);cursor:pointer"><input type="checkbox" data-pid="${esc(x.id)}" data-pgi="${gi}" ${cur.has(x.id)?'checked':''}><span class="d" style="white-space:nowrap">${esc(x.date)}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.opp||'—')}</span><span class="d">${esc(x.us)}-${esc(x.th)}</span></label>`).join('')}</div>`}).join('');
  openDlg(`<h3>累計に入れる試合を選ぶ</h3><p class="note">大会名のチェックで、その大会の試合をまとめて選択／解除できます。大会をまるごと選んでおくと、あとでその大会に保存された試合も自動で入ります。</p>
  <div class="dact" style="justify-content:flex-start;margin-top:6px"><button class="btn" id="pAll">すべて選択</button><button class="btn" id="pNone">すべて解除</button><span class="na" id="pCnt" style="align-self:center"></span></div>
  ${G.length?grp:'<p class="note">保存された試合はまだありません。</p>'}
  <div class="dact"><button class="btn" id="pX">やめる</button><button class="btn mar" id="pOk">この試合で集計</button></div>`,b=>{
    const games=[...b.querySelectorAll('[data-pid]')];
    const upd=()=>{keys.forEach((t,gi)=>{const L=games.filter(c=>c.dataset.pgi==String(gi)),n=L.filter(c=>c.checked).length,h=b.querySelector(`[data-pg="${gi}"]`);h.checked=n===L.length&&n>0;h.indeterminate=n>0&&n<L.length;b.querySelector(`[data-pc="${gi}"]`).textContent=n+'/'+L.length});b.querySelector('#pCnt').textContent=games.filter(c=>c.checked).length+'/'+games.length+'試合'};
    b.querySelectorAll('[data-pg]').forEach(h=>h.onchange=()=>{games.filter(c=>c.dataset.pgi===h.dataset.pg).forEach(c=>c.checked=h.checked);upd()});
    games.forEach(c=>c.onchange=upd);
    b.querySelector('#pAll').onclick=()=>{games.forEach(c=>c.checked=true);upd()};
    b.querySelector('#pNone').onclick=()=>{games.forEach(c=>c.checked=false);upd()};
    b.querySelector('#pX').onclick=()=>dlg.close();
    b.querySelector('#pOk').onclick=()=>{storeSel(new Set(games.filter(c=>c.checked).map(c=>c.dataset.pid)));dlg.close();renderHome()};
    upd()})}
function openTMan(){
  const TL=tournaments();
  openDlg(`<h3>大会の管理</h3><p class="note">大会を先に登録しておくと、新しい試合の準備で選べます。名前を変えると、その大会の試合すべての大会名も変わります。</p>
  <div class="fr"><label style="flex:1 1 260px">新しい大会名<input id="tNew" placeholder="例：インカレ2026"></label><button class="btn mar" id="tAdd">追加</button></div>
  ${TL.length?`<div class="scroll"><table><thead><tr><th>大会名</th><th class="r">試合</th><th></th></tr></thead><tbody>${TL.map((t,i)=>`<tr><td><input data-ti="${i}" value="${esc(t)}" style="width:100%;min-width:9em"></td><td class="r">${tGames(t)}</td><td style="white-space:nowrap"><button class="btn" data-tren="${i}" style="height:40px">名前を変更</button> <button class="btn" data-tdel="${i}" style="height:40px">削除</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="note">まだ大会はありません。</p>'}
  <p class="msg" id="tMsg"></p><div class="dact"><button class="btn pri" id="tClose">閉じる</button></div>`,b=>{
    const msg=t=>b.querySelector('#tMsg').textContent=t;
    const done=()=>{if(!$('home').hidden)renderHome();render()};
    b.querySelector('#tClose').onclick=()=>{dlg.close();done()};
    b.querySelector('#tAdd').onclick=()=>{const v=b.querySelector('#tNew').value.trim();if(!v){msg('大会名を入力してください。');return}if(tournaments().includes(v)){msg('同じ名前の大会がすでにあります。');return}
      const L=loadTL();L.unshift({name:v,added:today()});saveTL(L);if(draft)draft.tourn=v;openTMan();done()};
    b.querySelectorAll('[data-tren]').forEach(bt=>bt.onclick=()=>{const i=+bt.dataset.tren,old=TL[i],v=b.querySelector(`[data-ti="${i}"]`).value.trim();
      if(!v){msg('名前を空にはできません。消したいときは「削除」を押してください。');return}if(v===old){msg('名前が変わっていません。');return}
      if(TL.includes(v)&&bt.dataset.c!=='1'){bt.dataset.c='1';bt.textContent='まとめる';msg('「'+v+'」はすでにあります。もう一度押すと、2つの大会を1つにまとめます。');return}
      renameTourn(old,v);if(draft&&draft.tourn===old)draft.tourn=v;openTMan();done()});
    b.querySelectorAll('[data-tdel]').forEach(bt=>bt.onclick=()=>{const i=+bt.dataset.tdel,t=TL[i],n=tGames(t);
      if(bt.dataset.c!=='1'){bt.dataset.c='1';bt.textContent='本当に削除';msg(n?'「'+t+'」の'+n+'試合は「大会なし」になります（試合の記録は消えません）。もう一度押すと削除します。':'もう一度押すと「'+t+'」を削除します。');return}
      renameTourn(t,'');if(draft&&draft.tourn===t)draft.tourn='';openTMan();done()});
  })}
async function gPull(){
  try{const L=(await gCall({action:'list'})).games||[];const loc={};loadHist().forEach(x=>loc[x.id]=x);let n=0;
    for(const c of L){const l=loc[c.id];if(c.id===S.g.id)continue;if(!l||String(c.savedAt)>String(l.savedAt||'')){const x=(await gCall({action:'get',id:c.id})).game;if(x&&Array.isArray(x.events)){ensureTeam(x);const h2=loadHist().filter(r=>r.id!==x.id);h2.unshift(x);saveHist(h2);n++}}}
    saveLocal();if(!$('home').hidden)renderHome();return n?n+'試合を取り込みました（試合一覧・最近の試合に出ます）。':'取り込む試合はありません（この端末はすでに最新です）。'}
  catch(err){return err&&err.message==='key'?'合言葉が一致しません。':'取り込めませんでした（通信・設定を確認）。'}}
function changeTeam(tid){if(tid===S.tid)return;if(!S.g.demo&&S.g.events.length)archiveCurrent();switchTeam(tid);S.g=newGame('');undoStack=[];selOut.clear();selIn.clear();homeT=null;homeView='main';commit();renderHome()}
$('hTeam').onchange=e=>changeTeam(e.target.value);
function openTeamMan(){
  openDlg(`<h3>チームの管理</h3><p class="note">チームごとに、選手名簿・目安分数・警告の基準・大会を別々に持ちます。選手と平均出場時間は、チームを選んでから「設定」で登録します。</p>
  <div class="fr"><label style="flex:1 1 220px">新しいチーム名<input id="tmName" placeholder="例：福岡Breeze"></label><label>略称（得点の横に表示）<input id="tmShort" placeholder="例：Breeze" style="width:9em"></label><button class="btn mar" id="tmAdd">追加</button></div>
  <div class="scroll"><table><thead><tr><th>チーム名</th><th>略称</th><th class="r">選手</th><th></th></tr></thead><tbody>${S.teams.map((t,i)=>`<tr${t.id===S.tid?' style="font-weight:700"':''}><td><input data-tn2="${i}" value="${esc(t.name)}" style="width:100%;min-width:8em"></td><td><input data-ts2="${i}" value="${esc(t.short||'')}" style="width:7em"></td><td class="r">${(t.roster||[]).length}</td><td style="white-space:nowrap"><button class="btn" data-tsave="${i}" style="height:40px">保存</button> <button class="btn" data-tmem="${i}" style="height:40px">メンバー登録</button> <button class="btn" data-tdel2="${i}" style="height:40px">削除</button></td></tr>`).join('')}</tbody></table></div>
  <p class="msg" id="tmMsg"></p><div class="dact"><button class="btn pri" id="tmClose">閉じる</button></div>`,b=>{
    const msg=t=>b.querySelector('#tmMsg').textContent=t;
    b.querySelector('#tmClose').onclick=()=>{dlg.close();if(!$('home').hidden)renderHome();render()};
    b.querySelector('#tmAdd').onclick=()=>{const n=b.querySelector('#tmName').value.trim(),s=b.querySelector('#tmShort').value.trim();if(!n){msg('チーム名を入力してください。');return}if(S.teams.some(t=>t.name===n)){msg('同じ名前のチームがあります。');return}
      const id='t'+Date.now().toString(36);syncTeam();S.teams.push({id,name:n,short:s||n,roster:[],set:DEFSET()});changeTeam(id);openSettings()};
    b.querySelectorAll('[data-tsave]').forEach(bt=>bt.onclick=()=>{const i=+bt.dataset.tsave,t=S.teams[i],n=b.querySelector(`[data-tn2="${i}"]`).value.trim(),s=b.querySelector(`[data-ts2="${i}"]`).value.trim();if(!n){msg('チーム名は空にできません。');return}t.name=n;t.short=s||n;saveLocal();render();openTeamMan();if(!$('home').hidden)renderHome()});
    b.querySelectorAll('[data-tmem]').forEach(bt=>bt.onclick=()=>{const t=S.teams[+bt.dataset.tmem];changeTeam(t.id);openSettings()});
    b.querySelectorAll('[data-tdel2]').forEach(bt=>bt.onclick=()=>{const i=+bt.dataset.tdel2,t=S.teams[i];if(S.teams.length<2){msg('チームが1つだけのときは削除できません。');return}
      const n=loadHist().filter(x=>teamOf(x)===t.id).length;
      if(bt.dataset.c!=='1'){bt.dataset.c='1';bt.textContent='本当に削除';msg('「'+t.name+'」の名簿と設定を削除します。'+(n?'このチームの'+n+'試合の記録は試合一覧から見えなくなります（データは消えません。同じチームを開き直すと戻ります）。':'')+'もう一度押すと削除します。');return}
      const wasCur=t.id===S.tid;if(wasCur&&!S.g.demo&&S.g.events.length)archiveCurrent();S.teams.splice(i,1);if(wasCur){S.tid=S.teams[0].id;const c=curTeam();S.roster=c.roster;S.set=c.set;S.g=newGame('');undoStack=[]}homeT=null;saveLocal();openTeamMan();if(!$('home').hidden)renderHome();render()});
  })}
$('hTeamMan').onclick=openTeamMan;
$('homeBtn').onclick=showHome;
$('set').onclick=openSettings;
$('demoNew').onclick=()=>{showHome();$('home').querySelector('[data-h=new]').click()};
document.addEventListener('mouseup',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&!b.closest('dialog'))b.blur()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude\.ai|claudeusercontent/.test(location.host)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
render();renderStatus();showHome();setTimeout(gFlush,1500);
}
</script>
