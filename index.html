<title>Rotation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE work: a bench tool read at a glance, under pressure, by a head coach
   IDEA the scorer's table: a scoreboard strip above the official player sheet
   PICTURE five on-court cards coloured by load, bench beneath, rotation chart at the side
   COLOUR FU maroon #7d1d2c band, white cards, amber caution, red over-limit
   TYPE Barlow Semi Condensed for every clock and minute, Noto Sans JP for names and labels
   LAYOUT iPad landscape: band / court row of 5 / bench grid + side panel; phone: stacked single column */
:root{color-scheme:light;--bg:#f3efef;--card:#ffffff;--ink:#1b1214;--mute:#6b5c5f;--line:#e3d9da;--maroon:#7d1d2c;--maroon2:#9c2a3c;--yel:#e8a900;--yelbg:#fff3c4;--red:#d7263d;--redbg:#ffe1e5;--ok:#2d6e5c;--sel:#1240e0;--track:rgba(107,92,95,.22);--track2:rgba(107,92,95,.12)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#110b0c;--card:#1d1416;--ink:#f3ecec;--mute:#b3a3a6;--line:#3a2c2f;--maroon2:#d0566a;--yelbg:#3b2f0c;--redbg:#4a1520;--ok:#5fbfa3;--sel:#7d9bff;--track:rgba(179,163,166,.22);--track2:rgba(179,163,166,.12)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#110b0c;--card:#1d1416;--ink:#f3ecec;--mute:#b3a3a6;--line:#3a2c2f;--maroon2:#d0566a;--yelbg:#3b2f0c;--redbg:#4a1520;--ok:#5fbfa3;--sel:#7d9bff;--track:rgba(179,163,166,.22);--track2:rgba(179,163,166,.12)}
button,.pc{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.kb{display:none}
@media(hover:hover) and (pointer:fine){.kb{display:inline}.pc:hover{border-color:var(--maroon2)}.pb button:hover,.tools button:hover{background:rgba(255,255,255,.2)}.btn:hover:not(:disabled){filter:brightness(1.08)}}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.d{font-family:"Barlow Semi Condensed","Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums}
.band{background:var(--maroon);color:#fff;padding:max(10px,env(safe-area-inset-top)) max(2vw,16px,env(safe-area-inset-right)) 10px max(2vw,16px,env(safe-area-inset-left));display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 20px;align-items:center}
.brand{font-weight:700;font-size:17px;line-height:1.2}
.brand small{display:block;font-weight:400;font-size:13px;opacity:.85}
.board{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:center}
.team{display:flex;align-items:center;gap:6px}
.team .lab{font-size:13px;opacity:.85;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-size:44px;font-weight:700;line-height:1;min-width:1.6em;text-align:center}
.pb{display:flex;gap:4px}
.pb button{min-width:40px;height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;font-weight:700;cursor:pointer}
.pb button:active{background:rgba(255,255,255,.3)}
.clock{display:flex;align-items:center;gap:8px;background:#1b0b0f;border-radius:12px;padding:4px 6px 4px 14px}
.per{font-size:22px;font-weight:600;color:#ffcf5a}
.time{font-size:52px;font-weight:700;line-height:1;background:none;border:0;color:#fff;cursor:pointer;padding:0 4px}
.go{width:56px;height:56px;border-radius:10px;border:0;font-weight:700;font-size:15px;cursor:pointer;background:#2fae6e;color:#fff}
.go.stop{background:var(--red)}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

function derive(){
  const g=S.g,now=gameTime(),P={},on=new Set(),lu={},log=[];let us=0,th=0,segStart=0,segKey='';
  const pl=n=>P[n]||(P[n]={iv:[],pm:0,lastIn:null,lastOut:null});
  const L=k=>lu[k]||(lu[k]={sec:0,pf:0,pa:0});
  for(const e of g.events){
    if(e.k==='sub'){
      if(on.size)L(segKey).sec+=Math.max(0,e.gt-segStart);
      e.out.forEach(n=>{on.delete(n);const p=pl(n);if(p.lastIn!=null){p.iv.push([p.lastIn,e.gt]);p.lastIn=null}p.lastOut=e.gt});
      e.in.forEach(n=>{on.add(n);const p=pl(n);if(p.lastIn==null)p.lastIn=e.gt});
      segStart=e.gt;segKey=keyOf(on);log.push({e,us,th});
    }else if(e.k==='pts'){
      if(e.side==='us')us+=e.v;else th+=e.v;
      const l=L(keyOf(e.on));if(e.side==='us')l.pf+=e.v;else l.pa+=e.v;
      e.on.forEach(n=>{pl(n).pm+=e.side==='us'?e.v:-e.v});
    }
  }
  if(on.size)L(segKey).sec+=Math.max(0,now-segStart);
  const ps=PSTART(g.period),pe=ps+PLEN(g.period),M={};
  for(const r of S.roster){
    const p=pl(r.no),all=p.iv.concat(p.lastIn!=null?[[p.lastIn,now]]:[]),isOn=on.has(r.no);
    const reg=ov(all,0,REG),ot=ov(all,REG,1e9),cur=ov(all,ps,pe);
    let stint=null;if(isOn){let st=p.lastIn;if(now>=HALF&&st<HALF)st=HALF;stint=Math.max(0,now-st)}
    const rest=!isOn&&p.lastOut!=null?Math.max(0,now-p.lastOut):null;
    const ea=effAvg(r),qT=ea/4,cT=ea*Math.min(g.period,4)/4;
    const qL=g.period<=4?lvl(cur,qT):0,cL=lvl(reg,cT);
    const sL=stint==null?0:stint>=S.set.sr?2:stint>=S.set.sy?1:0;
    M[r.no]={r,on:isOn,all,reg,ot,tot:reg+ot,cur,qT,cT,qL,cL,sL,stint,rest,pm:p.pm,lv:qL};
  }
  return{now,on,M,lu,log,us,th};
}

function barRow(lab,v,t,l){
  if(!(t>0))return `<div class="mr"><span>${lab}</span><span class="na">目安なし</span><span class="v">${fmt(v)}</span></div>`;
  const mx=t+120,w=Math.min(100,v/mx*100),mk=t/mx*100;
  return `<div class="mr"><span>${lab}</span><div class="bar"><i class="lv${l}" style="width:${w}%"></i><b style="left:${mk}%"></b></div><span class="v">${fmt(v)}/${fmt(t)}</span></div>`;
}
function pmHtml(pm){const c=pm>0?'pos':pm<0?'neg':'';return `<small class="pm ${c}">${pm>0?'+':''}${pm}</small>`}

function renderTL(D){
  const g=S.g,total=g.period>4?REG+(g.period-4)*OT:REG,rows=[];
  const lines=[];for(let p=2;p<=Math.max(4,g.period);p++){lines.push(`<em class="${p===3?'hf':''}" style="left:${PSTART(p)/total*100}%"></em>`)}
  for(const r of S.roster){const m=D.M[r.no];if(!m||(!m.all.length))continue;
    const seg=m.all.map(([a,b],i)=>`<span class="${m.on&&i===m.all.length-1?'open':''}" style="left:${a/total*100}%;width:${Math.max(.3,(b-a)/total*100)}%"></span>`).join('');
    rows.push(`<div class="tlr"><span class="n">#${r.no} ${esc(r.name)}</span><div class="trk">${lines.join('')}${seg}<i class="now" style="left:${Math.min(100,D.now/total*100)}%"></i></div><span class="t">${fmt(m.tot)}</span></div>`)}
  const qs=[];for(let p=1;p<=Math.max(4,g.period);p++)qs.push(`<span>${pName(p)}</span>`);
  $('tl').innerHTML=rows.length?`<div class="tl">${rows.join('')}<div class="qax"><span></span><div>${qs.join('')}</div><span></span></div></div>`:'<p class="note">交代を記録すると表示されます。</p>';
  $('tlNote').textContent='経過 '+fmt(D.now);
}
const luRate=v=>v.sec>0?(v.pf-v.pa)/(v.sec/60):null;
const LU_MIN=60;
const luSort=(a,b)=>{const sa=a[1].sec>=LU_MIN,sb=b[1].sec>=LU_MIN;if(sa!==sb)return sa?-1:1;const x=luRate(a[1]),y=luRate(b[1]);if(x===null&&y===null)return b[1].sec-a[1].sec;if(x===null)return 1;if(y===null)return -1;return y-x||b[1].sec-a[1].sec};
const fmtRate=r=>r===null?'—':(r>0?'+':'')+r.toFixed(2);
function renderLU(D){
  const rows=Object.entries(D.lu).filter(([k,v])=>k&&(v.sec>0||v.pf||v.pa)).sort(luSort).slice(0,5);
  if(!rows.length){$('lu').innerHTML='<p class="note">まだ記録がありません。</p>';return}
  const nm=n=>{const r=rosterMap()[n];return r?esc(r.name):'#'+n};
  $('lu').innerHTML=`<table><thead><tr><th>5人</th><th class="r">時間</th><th class="r">得</th><th class="r">失</th><th class="r">+/-</th><th class="r">1分あたり</th></tr></thead><tbody>${rows.map(([k,v])=>{const d=v.pf-v.pa,cur=k===keyOf(D.on);return `<tr${cur?' style="font-weight:700"':''}${v.sec<LU_MIN&&!cur?' class="short"':''}><td>${k.split('-').map(nm).join('・')}${cur?'（出場中）':''}</td><td class="r">${fmt(v.sec)}</td><td class="r">${v.pf}</td><td class="r">${v.pa}</td><td class="r">${d>0?'+':''}${d}</td><td class="r"><b>${fmtRate(luRate(v))}</b></td></tr>`}).join('')}</tbody></table>`;
}
function suggestions(D){
  const g=S.g;if(g.final||!g.events.length||g.period>4)return null;
  const outs=[],ins=[];
  for(const r of S.roster){const m=D.M[r.no];if(!m)continue;
    if(m.on){const over=Math.max(m.cur-m.qT,m.reg-m.cT),st=m.stint||0,sOver=st-S.set.sy,score=Math.max(over,0)+Math.max(sOver,0)*1.5+(over>-60?over/10:0);
      const why=[];if(m.cur-m.qT>-60)why.push('Q'+(m.cur>=m.qT?'+':'−')+fmt(Math.abs(m.cur-m.qT)));else if(m.reg-m.cT>-60)why.push('累計'+(m.reg>=m.cT?'+':'−')+fmt(Math.abs(m.reg-m.cT)));if(sOver>=0)why.push('連続'+fmt(st));
      if(over>-60||sOver>=0)outs.push({no:r.no,name:r.name,score,why:why.join('・')})}
    else if(r.dr){const def=m.cT-m.reg,qleft=m.qT-m.cur,rest=m.rest==null?9999:m.rest;
      if(qleft>60||def>60)ins.push({no:r.no,name:r.name,score:Math.max(def,qleft)+Math.min(rest,600)/6,why:'目安まで'+fmt(Math.max(def,qleft))+(m.rest!=null?'・休'+fmt(m.rest):'')})}}
  outs.sort((a,b)=>b.score-a.score);ins.sort((a,b)=>b.score-a.score);
  return{outs:outs.slice(0,3),ins:ins.slice(0,3)}}
function renderSugg(D){const el=$('sugg'),s=suggestions(D);if(!s||!s.ins.length){el.hidden=true;return}el.hidden=false;
  const chip=(x,z)=>`<button class="sbtn${(z==='o'?selOut:selIn).has(x.no)?' on':''}" data-sg="${z}" data-no="${x.no}"><b>${x.no}</b>${esc(x.name)}</button>`;
  el.innerHTML=`<div class="sg"><b>入れる候補</b>${s.ins.map(x=>chip(x,'i')).join('')||'<span class="na">なし</span>'}</div>`}
function render(){
  const g=S.g,D=derive();
  $('scUs').textContent=D.us;$('scTh').textContent=D.th;
  $('per').textContent=g.final?'終了':pName(g.period);
  $('time').textContent=fmtC(g.clock);
  const go=$('go');go.textContent=g.running?'停止':'開始';go.classList.toggle('stop',g.running);go.disabled=g.final;
  $('oppLab').textContent=g.opp||'相手';$('usLab').textContent=curTeam().short||curTeam().name;$('oppLine').textContent='vs '+(g.opp||'—')+'　'+g.date+(g.tourn?'　'+g.tourn:'');
  $('demo').hidden=!g.demo;$('undo').disabled=!undoStack.length;$('next').disabled=g.final;
  $('stintLg').textContent='連続出場：'+fmt(S.set.sy)+'で黄／'+fmt(S.set.sr)+'で赤（ハーフでリセット）';
  const onArr=S.roster.filter(r=>D.on.has(r.no));
  const extra=[...D.on].filter(n=>!rosterMap()[n]);
  let ch=onArr.map(r=>courtCard(D.M[r.no])).join('')+extra.map(n=>`<div class="empty">#${n}（名簿にない背番号）</div>`).join('');
  for(let i=D.on.size;i<5;i++)ch+=`<div class="empty">${i===0&&!g.events.length?'ベンチからスターター5人をタップ':'空き'}</div>`;
  $('court').innerHTML=ch;
  $('courtHint').textContent=D.on.size<5?(5-D.on.size)+'人空き：ベンチをタップで即入場':'タップで交代候補（OUT）';
  $('bench').innerHTML=S.roster.filter(r=>r.dr&&!D.on.has(r.no)).map(r=>benchCard(D.M[r.no])).join('')||'<p class="note">登録選手がいません（設定で登録）。</p>';
  renderSugg(D);renderTL(D);renderLU(D);
  const pend=selOut.size||selIn.size;$('pend').hidden=!pend;
  if(pend){$('pendTxt').innerHTML=`<b>OUT</b> ${[...selOut].map(n=>esc(label(n))).join('、')||'—'}　→　<b>IN</b> ${[...selIn].map(n=>esc(label(n))).join('、')||'—'}　<span class="na">（${pName(g.period)} 残り${fmtC(g.clock)}で記録）</span>`;$('pendOk').disabled=!(selOut.size===selIn.size&&selIn.size>0)}
}

function loadHist(){try{const a=JSON.parse(localStorage.getItem(LH)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}

function scoreOf(g){let us=0,th=0;for(const e of g.events)if(e.k==='pts'){if(e.side==='us')us+=e.v;else th+=e.v}return[us,th]}
function makeRec(){const g=S.g,D=derive();const min=S.roster.filter(r=>D.M[r.no]&&D.M[r.no].tot>0).map(r=>{const m=D.M[r.no];return{no:r.no,name:r.name,min:fmt(m.tot),dec:+(m.tot/60).toFixed(2),pm:m.pm}});return Object.assign(JSON.parse(JSON.stringify(g)),{running:false,clock:Math.round(g.clock),roster:JSON.parse(JSON.stringify(S.roster)),set:Object.assign({},S.set),us:D.us,th:D.th,min,team:g.team||S.tid,teamName:curTeam().name,teamShort:curTeam().short,savedAt:new Date().toISOString()})}
function archiveCurrent(){const g=S.g;if(g.demo||!g.events.length)return true;const rec=makeRec();const a=loadHist().filter(x=>x.id!==g.id);a.unshift(rec);const ok=saveHist(a);markDirty(g.id);if(!ok)alertMsg('試合一覧への保存に失敗しました（端末の空き容量不足）。古い試合を削除してください。');return ok}

async function gCall(body){
  const ctl=typeof AbortController!=='undefined'?new AbortController():null;const t=ctl?setTimeout(()=>ctl.abort(),20000):0;
  try{const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:CFG.key},body)),signal:ctl?ctl.signal:undefined});
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'error');return j}finally{if(t)clearTimeout(t)}}
function markDirty(id){if(!gOn()||!id)return;if(!GQ.includes(id)){GQ.push(id);saveQ()}clearTimeout(gTimer);gTimer=setTimeout(gFlush,3000)}
async function gFlush(){
  if(!gOn()||gBusy||!GQ.length){renderStatus();return}
  if(typeof navigator!=='undefined'&&navigator.onLine===false){gMsg='未送信 '+GQ.length+'試合（通信回復後に自動送信）';renderStatus();return}
  gBusy=true;
  for(const id of GQ.slice()){
    let rec=null;
    if(id===S.g.id&&!S.g.demo&&S.g.events.length)rec=makeRec();else rec=loadHist().find(x=>x.id===id)||null;
    if(!rec){GQ=GQ.filter(x=>x!==id);continue}
    try{await gCall({action:'save',game:rec});GQ=GQ.filter(x=>x!==id);gMsg='スプレッドシートに保存 '+hhmm()}
    catch(e){gMsg=(e&&e.message==='key')?'スプレッドシート：合言葉が一致しません（設定を確認）':'未送信 '+GQ.length+'試合（通信回復後に自動送信）';break}
  }
  saveQ();gBusy=false;renderStatus();if(!$('home').hidden&&homeView==='main')$('hSync').textContent=gMsg||'スプレッドシート連携中';
}
window.addEventListener('online',()=>gFlush());

function maxStints(m){let best=0;for(const[a,b]of m.all){if(a<HALF&&b>HALF){best=Math.max(best,HALF-a,b-HALF)}else best=Math.max(best,b-a)}return best}
function report(){

  L.push('Q別：'+qs.join(' / '));

  L.push('▲＝目安より1分超多い　▽＝3分以上少ない');
  const st=pl.map(m=>({m,s:maxStints(m)})).sort((a,b)=>b.s-a.s).slice(0,3).filter(x=>x.s>0);
  if(st.length){L.push('');L.push('■長かった連続出場');st.forEach(x=>L.push('・'+nm(x.m.r.no)+' '+fmt(x.s)+(x.s>=S.set.sr?'（基準超え）':x.s>=S.set.sy?'（注意）':'')))}
  const lus=Object.entries(D.lu).filter(([k,v])=>k&&k.split('-').length===5&&v.sec>=180).map(([k,v])=>({k,v,r:luRate(v)})).sort((a,b)=>b.r-a.r);
  if(lus.length){const show=x=>'・'+x.k.split('-').map(n=>{const r=rosterMap()[n];return r?r.name:'#'+n}).join('・')+' '+fmt(x.v.sec)+' '+(x.v.pf-x.v.pa>0?'+':'')+(x.v.pf-x.v.pa)+'（1分あたり'+fmtRate(x.r)+'）';
    L.push('');L.push('■ラインナップ（3分以上）');L.push('良かった');lus.slice(0,2).forEach(x=>L.push(show(x)));if(lus.length>2){L.push('課題');lus.slice(-2).reverse().forEach(x=>L.push(show(x)))}}
  return L.join('\n')}
function sheets(){

  dr.forEach(r=>{const m=D.M[r.no],row=[r.no,r.name];for(let p=1;p<=maxP;p++)row.push(fmt(ov(m.all,PSTART(p),PSTART(p)+PLEN(p))));row.push(fmt(m.tot));qs.push(row)});
  const nm=n=>{const r=rosterMap()[n];return r?r.name:'#'+n};
  const lu=[['5人','時間','時間(分)','得点','失点','+/-','+/-（1分あたり）']];
  Object.entries(D.lu).filter(([k,v])=>k&&(v.sec||v.pf||v.pa)).sort(luSort).forEach(([k,v])=>{const r=luRate(v);lu.push([k.split('-').map(n=>'#'+n+' '+nm(+n)).join(' / '),fmt(v.sec),+(v.sec/60).toFixed(2),v.pf,v.pa,v.pf-v.pa,r===null?'':+r.toFixed(2)])});
  const lg=[['Q','残り時間','IN','OUT','スコア（'+(curTeam().short||curTeam().name)+'-相手）']];

}

      renameTourn(old,v);if(draft&&draft.tourn===old)draft.tourn=v;openTMan();done()});
    b.querySelectorAll('[data-tdel]').forEach(bt=>bt.onclick=()=>{const i=+bt.dataset.tdel,t=TL[i],n=tGames(t);
      if(bt.dataset.c!=='1'){bt.dataset.c='1';bt.textContent='本当に削除';msg(n?'「'+t+'」の'+n+'試合は「大会なし」になります（試合の記録は消えません）。もう一度押すと削除します。':'もう一度押すと「'+t+'」を削除します。');return}
      renameTourn(t,'');if(draft&&draft.tourn===t)draft.tourn='';openTMan();done()});
  })}
function changeTeam(tid){if(tid===S.tid)return;if(!S.g.demo&&S.g.events.length)archiveCurrent();switchTeam(tid);S.g=newGame('');undoStack=[];selOut.clear();selIn.clear();homeT=null;homeView='main';commit();renderHome()}
$('hTeam').onchange=e=>changeTeam(e.target.value);
function openTeamMan(){
  openDlg(`<h3>チームの管理</h3><p class="note">チームごとに、選手名簿・目安分数・警告の基準・大会を別々に持ちます。選手と平均出場時間は、チームを選んでから「設定」で登録します。</p>
  <div class="fr"><label style="flex:1 1 220px">新しいチーム名<input id="tmName" placeholder="例：福岡Breeze"></label><label>略称（得点の横に表示）<input id="tmShort" placeholder="例：Breeze" style="width:9em"></label><button class="btn mar" id="tmAdd">追加</button></div>
  <div class="scroll"><table><thead><tr><th>チーム名</th><th>略称</th><th class="r">選手</th><th></th></tr></thead><tbody>${S.teams.map((t,i)=>`<tr${t.id===S.tid?' style="font-weight:700"':''}><td><input data-tn2="${i}" value="${esc(t.name)}" style="width:100%;min-width:8em"></td><td><input data-ts2="${i}" value="${esc(t.short||'')}" style="width:7em"></td><td class="r">${(t.roster||[]).length}</td><td style="white-space:nowrap"><button class="btn" data-tsave="${i}" style="height:40px">保存</button> <button class="btn" data-tmem="${i}" style="height:40px">メンバー登録</button> <button class="btn" data-tdel2="${i}" style="height:40px">削除</button></td></tr>`).join('')}</tbody></table></div>
  <p class="msg" id="tmMsg"></p><div class="dact"><button class="btn pri" id="tmClose">閉じる</button></div>`,b=>{
    const msg=t=>b.querySelector('#tmMsg').textContent=t;
    b.querySelector('#tmClose').onclick=()=>{dlg.close();if(!$('home').hidden)renderHome();render()};
    b.querySelector('#tmAdd').onclick=()=>{const n=b.querySelector('#tmName').value.trim(),s=b.querySelector('#tmShort').value.trim();if(!n){msg('チーム名を入力してください。');return}if(S.teams.some(t=>t.name===n)){msg('同じ名前のチームがあります。');return}
      const id='t'+Date.now().toString(36);syncTeam();S.teams.push({id,name:n,short:s||n,roster:[],set:DEFSET()});changeTeam(id);openSettings()};
    b.querySelectorAll('[data-tsave]').forEach(bt=>bt.onclick=()=>{const i=+bt.dataset.tsave,t=S.teams[i],n=b.querySelector(`[data-tn2="${i}"]`).value.trim(),s=b.querySelector(`[data-ts2="${i}"]`).value.trim();if(!n){msg('チーム名は空にできません。');return}t.name=n;t.short=s||n;saveLocal();render();openTeamMan();if(!$('home').hidden)renderHome()});
    b.querySelectorAll('[data-tmem]').forEach(bt=>bt.onclick=()=>{const t=S.teams[+bt.dataset.tmem];changeTeam(t.id);openSettings()});
    b.querySelectorAll('[data-tdel2]').forEach(bt=>bt.onclick=()=>{const i=+bt.dataset.tdel2,t=S.teams[i];if(S.teams.length<2){msg('チームが1つだけのときは削除できません。');return}
      const n=loadHist().filter(x=>teamOf(x)===t.id).length;
      if(bt.dataset.c!=='1'){bt.dataset.c='1';bt.textContent='本当に削除';msg('「'+t.name+'」の名簿と設定を削除します。'+(n?'このチームの'+n+'試合の記録は試合一覧から見えなくなります（データは消えません。同じチームを開き直すと戻ります）。':'')+'もう一度押すと削除します。');return}
      const wasCur=t.id===S.tid;if(wasCur&&!S.g.demo&&S.g.events.length)archiveCurrent();S.teams.splice(i,1);if(wasCur){S.tid=S.teams[0].id;const c=curTeam();S.roster=c.roster;S.set=c.set;S.g=newGame('');undoStack=[]}homeT=null;saveLocal();openTeamMan();if(!$('home').hidden)renderHome();render()});
  })}
$('hTeamMan').onclick=openTeamMan;
$('homeBtn').onclick=showHome;
$('set').onclick=openSettings;
$('demoNew').onclick=()=>{showHome();$('home').querySelector('[data-h=new]').click()};
document.addEventListener('mouseup',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&!b.closest('dialog'))b.blur()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude\.ai|claudeusercontent/.test(location.host)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
render();renderStatus();showHome();setTimeout(gFlush,1500);
}
</script>
</body>
